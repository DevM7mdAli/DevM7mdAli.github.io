    <script type="text/javascript">

      // Restores the real path from the query string that public/404.html
      // encoded, before React Router mounts, so client-side routing (and
      // its 404 boundary) sees the actual requested URL instead of "/".
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
